hazelcast:
  cluster-name: dev-cluster
  network:
    join:
      tcp-ip:
        enabled: true
        member-list:
          - hazelcast1
          - hazelcast2
          - hazelcast3

    rest-api:
      enabled: true
      endpoint-groups:
        HEALTH_CHECK:
          enabled: true

  map:
    messages_map:
      backup-count: 2
      async-backup-count: 0
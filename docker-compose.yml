services:
  config_server:
    image: config-server:latest
    build:
      context: .
      dockerfile: config_server/Dockerfile
    ports:
      - "8000:8000"

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      # Using Kraft mode to avoid needing Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
            --list",
        ] # list all existing topics via shell command, either 0 or 1+
      interval: 5s
      timeout: 5s
      retries: 5
  facade:
    image: facade-service:latest
    build:
      context: .
      dockerfile: facade/Dockerfile
    ports:
      - "8080:8000"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - CONFIG_SERVER_URL=http://config_server:8000
    depends_on:
      kafka:
        condition: service_healthy
      config_server:
        condition: service_started

  logging1:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    environment:
      - MY_URL=http://logging1:8000
      - CONFIG_SERVER_URL=http://config_server:8000
    depends_on:
      hazelcast1:
        condition: service_healthy
      config_server:
        condition: service_started

  logging2:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    environment:
      - MY_URL=http://logging2:8000
      - CONFIG_SERVER_URL=http://config_server:8000
    depends_on:
      hazelcast1:
        condition: service_healthy
      config_server:
        condition: service_started

  logging3:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    environment:
      - MY_URL=http://logging3:8000
      - CONFIG_SERVER_URL=http://config_server:8000
    depends_on:
      hazelcast1:
        condition: service_healthy
      config_server:
        condition: service_started

  counter_service:
    image: counter-service:latest
    build:
      context: .
      dockerfile: counter_service/Dockerfile
    environment:
      - DB_URL=postgresql://user:password@postgres_db:5432/counter_db
      - MY_URL=http://counter_service:8000
      - KAFKA_BROKERS=kafka:9092
      - CONFIG_SERVER_URL=http://config_server:8000
    depends_on:
      postgres_db:
        condition: service_healthy
      config_server:
        condition: service_started
      kafka:
        condition: service_healthy

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: counter_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d counter_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  hazelcast1:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:5701/hazelcast/health/node-state" ]
      interval: 10s
      timeout: 5s
      retries: 5

  hazelcast2:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5702:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:5701/hazelcast/health/node-state" ]
      interval: 10s
      timeout: 5s
      retries: 5

  hazelcast3:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5703:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://127.0.0.1:5701/hazelcast/health/node-state" ]
      interval: 10s
      timeout: 5s
      retries: 5

  management-center:
    image: hazelcast/management-center:5.3
    ports:
      - "8081:8080"
    environment:
      - MC_DEFAULT_CLUSTER=dev-cluster
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast1,hazelcast2,hazelcast3

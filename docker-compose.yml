services:
  facade:
    image: facade-service:latest
    build:
      context: .
      dockerfile: facade/Dockerfile
    ports:
      - "8080:8000"
    depends_on:
      - logging1
      - logging2
      - logging3
      - counter_service

  logging1:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    depends_on:
      - hazelcast1

  logging2:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    depends_on:
      - hazelcast1

  logging3:
    image: logging-service:latest
    build:
      context: .
      dockerfile: logging_service/Dockerfile
    depends_on:
      - hazelcast1

  counter_service:
    image: counter-service:latest
    build:
      context: .
      dockerfile: counter_service/Dockerfile
    environment:
      - DB_URL=postgresql://user:password@postgres_db:5432/counter_db
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: counter_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d counter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  hazelcast1:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml

  hazelcast2:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5702:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml

  hazelcast3:
    image: hazelcast/hazelcast:5.3
    ports:
      - "5703:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - HZ_CLUSTERNAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml

  management-center:
    image: hazelcast/management-center:5.3
    ports:
      - "8081:8080"
    environment:
      - MC_DEFAULT_CLUSTER=dev-cluster
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast1,hazelcast2,hazelcast3